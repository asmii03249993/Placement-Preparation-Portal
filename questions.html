<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Technical Questions</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


    <!-- Header -->
    <header>

        <h1>
            Placement Preparation Portal
        </h1>

        <p>
            Technical Questions
        </p>

    </header>


    <!-- Main Content -->
    <main class="container">


        <!-- Test Header -->
        <div class="test-header">

            <h2 id="categoryTitle">
                Loading...
            </h2>


            <div class="timer">

                ⏱️ Time Remaining:

                <span id="timer">
                    10:00
                </span>

            </div>

        </div>


        <!-- Questions will appear here -->
        <div id="questionContainer">

            <p>
                Loading questions...
            </p>

        </div>


    </main>


    <!-- JavaScript -->
    <script src="./js/questions.js"></script>


</body>

</html>
