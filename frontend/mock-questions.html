<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mock Test Questions</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <header>

        <h1>
            Placement Preparation Portal
        </h1>

        <p>
            Mock Test
        </p>

    <main class="container">

        </div>


        <!-- Mock Questions -->

        <div id="questionContainer">

            <p>
                Loading mock test questions...
            </p>

        </div>


    </main>


    <!-- JavaScript -->

    <script src="./js/mock-questions.js"></script>


</body>

</html>
